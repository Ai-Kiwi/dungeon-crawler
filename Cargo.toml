[package]
name = "singleplayer_dungion_crawler"
version = "0.1.0"
edition = "2021"

[dependencies]
rand = "0.8.5"
random-string = "1.1.0"
raylib = { version = "5.0" }
noise = "0.9"
trig = "0.1.3"
dyn-clone = "1.0.18"

[dependencies.uuid]
version = "1.13.1"
features = [
    "v4",                # Lets you generate random UUIDs
    "fast-rng",          # Use a faster (but still sufficiently random) RNG
    "macro-diagnostics", # Enable better diagnostics for compile-time UUIDs
]

